# Lookup UUID Order (Otomatis) — SKYDEV
#
# Alur yang diminta pemilik:
#   Order dibuat > script pencari UUID di GitHub Actions jalan
#   berdasarkan nama customer > jika UUID didapatkan, langsung
#   kirim ke Telegram.
#
# Cara kerja workflow ini:
#   - Terjadwal setiap 5 menit (cron GitHub Actions, bisa
#     terlambat beberapa menit tergantung antrean GitHub).
#   - lookup_order_uuid.py mengambil order dengan
#     customer_uuid IS NULL dan uuid_status = 'pending',
#     menjalankan lookup_uuid.py per order, lalu PATCH
#     customer_uuid ke Supabase toko.
#   - Begitu PATCH berhasil, trigger UPDATE di database
#     (migrasi-uuid-order.sql) yang mengirim notifikasi
#     Telegram lengkap dengan tombol Salin UUID.
#   - Workflow ini sendiri TIDAK mengirim Telegram langsung,
#     supaya tidak ada notifikasi ganda.
#   - Jika lookup gagal, order ditandai uuid_status='failed'
#     dan TIDAK dikirimi Telegram. Ulangi lewat mode manual
#     di bawah (isi order_id + customer_name).
#
# Log workflow ini SENGAJA TIDAK dihapus otomatis, supaya
# hasil lookup per order masih bisa dicek ulang.
# UUID lengkap tidak dicetak ke log, hanya 8 karakter pertama.
name: Lookup UUID Order (Otomatis)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      order_id:
        description: 'Mode satu order: ID order (uuid) — kosongkan untuk mode polling'
        required: false
        default: ''
      customer_name:
        description: 'Mode satu order: Nama customer (Nama#Kode) — wajib bila order_id diisi'
        required: false
        default: ''
      limit:
        description: 'Mode polling: maksimal order per run'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  lookup-order-uuid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi urllib3

      - name: Lookup UUID order dan update Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          PROBE_DEVICE_ID: ${{ secrets.PROBE_DEVICE_ID }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          ORDER_ID: ${{ inputs.order_id }}
          CUSTOMER_NAME: ${{ inputs.customer_name }}
          LOOKUP_LIMIT: ${{ inputs.limit }}
        run: python -u lookup_order_uuid.py
