# Diagnostik TCP ToxicBird — TAHAP 15 / EVENT "login" (lihat tcp_search10_probe.py).
#
# Temuan dari rekaman main-menu game: sesudah Connected, game
# mengirim Event "login" (USER_SESSION JWT + versi 1.93.3), lalu
# server membalas "tbugv" + JoinedRoom — TANPA frame JoinRoom
# dari klien. Semua probe sebelumnya tidak pernah mengirim event
# ini, sehingga sesi dianggap anonim dan event friends diabaikan.
# Probe ini menambahkan event login persis seperti game.
#
# Akun: akun bot pemilik (fallback hardcode di script atas
# perintah pemilik; env Secrets menang kalau ada).
#
# CARA PAKAI:
# 1. Taruh file ini di: .github/workflows/tcp-search10-probe.yml
# 2. Taruh tcp_search10_probe.py di root repo yang sama.
# 3. Tab Actions -> "TCP Search10 Probe" -> Run workflow ->
#    isi search_name (mis. admin#000) -> baca log: cari
#    "LOGIN TERBUKTI" / "HASIL SEARCH DITERIMA" + UUID.
#    Kirim seluruh log ke Muse.

name: TCP Search10 Probe

on:
  workflow_dispatch:
    inputs:
      search_name:
        description: "Nama pemain yang dicari (boleh nama#kode, mis. admin#000)"
        required: true
        default: "admin#000"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi urllib3

      - name: Run search10 probe
        env:
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          PROBE_DEVICE_ID: ${{ secrets.PROBE_DEVICE_ID }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          SEARCH_NAME: ${{ inputs.search_name }}
        run: python -u tcp_search10_probe.py
