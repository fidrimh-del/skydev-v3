# UGC Join Diagnostic 3 — join pasif + unpack Batch + activity-get activity-tier (manual, sekali jalan).
# Kriteria sukses (dari pemilik): history join UGC target 6 -> 7.
# Bot: akun probe (fallback hardcode di lookup_uuid.py atas perintah pemilik,
# repo private); Secrets FSTR_*/PROBE_* menang kalau ada.
# Log run SENGAJA tidak dihapus (bukti join).
name: UGC Join Diagnostic 3
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u ugc_join_diag3.py
        env:
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
