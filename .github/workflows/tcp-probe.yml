# Diagnostik TCP ToxicBird — TAHAP 1 (lihat tcp_probe.py).
#
# CARA PAKAI:
# 1. Taruh file ini di: .github/workflows/tcp-probe.yml (repo panel)
# 2. Taruh tcp_probe.py di root repo yang sama.
# 3. Secrets yang dibutuhkan (Settings -> Secrets and variables ->
#    Actions): SUPABASE_URL, SUPABASE_SERVICE_KEY.
#    FSTR_APP_KEY / FSTR_APP_SECRET untuk sementara di-hardcode di
#    tcp_probe.py (uji coba, repo private) — setelah berhasil,
#    buat keduanya sebagai Secrets dan hapus nilai hardcode dari
#    script (workflow ini sudah meneruskan env-nya, jadi akan
#    menang otomatis).
# 4. Tab Actions -> "TCP Probe" -> Run workflow -> baca log:
#    laporkan body allocation + hasil dengar TCP (hex dump atau
#    timeout). Dari situlah v2 (handshake + SearchFriend) dibangun.

name: TCP Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi urllib3

      - name: Run TCP probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
        run: python tcp_probe.py
