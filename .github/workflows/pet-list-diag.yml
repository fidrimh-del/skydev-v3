name: DIAG Pet List (1 bot)

# Diag sekali jalan (bukan produksi): 1 bot, login -> kirim PageRequest
# daftar pet -> catat SEMUA RoomEvent mentah + parse PetData (PetId,
# DisplayName, Type). Command pet belum terkonfirmasi dari dump, jadi
# coba "pet" dulu lalu "pets" bila tak ada respons.
# Dibuat 2026-11-08 atas permintaan Bartes. Jangan dipakai untuk order.
# Kredensial bot via input (akun Gmail mandiri, TIDAK ada di panel DB).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot (akun yang dicek pet-nya)"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      commands:
        description: "RoomEvent command pet (koma, dicoba berurutan)"
        required: false
        default: "pet,pets"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u pet_list_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --commands "${{ inputs.commands }}"
        env:
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
