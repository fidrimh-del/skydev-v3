name: DIAG Friend Invite — bot kirim permintaan teman

# Bot login lalu kirim invite pertemanan (RoomEvent "friends", f1=1 Invite)
# ke UUID target. Target lalu TERIMA permintaan di game (daftar teman).
# Setelah berteman, bot bisa join server target via destinationUserId.
# BELUM TERBUKTI apakah bot harus satu room dengan target — probe ini
# join room alokasi biasa dulu, lalu kirim invite.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot (tanpa nama)"
        required: true
        default: "33e8a45c033845b2@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      target_user_id:
        description: "UUID target (yang menerima permintaan teman)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      listen:
        description: "Dengarkan hasil berapa detik"
        required: false
        default: "30"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u friend_invite_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --target-user-id "${{ inputs.target_user_id }}" --listen "${{ inputs.listen }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
