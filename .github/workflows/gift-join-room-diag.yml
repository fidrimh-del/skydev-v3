name: DIAG Gift Pet Join-Room (1 bot)

# Diag sekali jalan (bukan produksi): 1 bot alokasi lobby DIULANG sampai
# gameServerId cocok dengan server target (SkyDev), lalu JoinRoom(nomor
# room target) dan kirim 1 pet ke 1 penerima UUID via RoomEvent 'gifting'.
# Dibuat 2026-11-09 atas permintaan Bartes — menguji dugaan bahwa gift
# (RoomEvent) hanya sampai ke penerima bila pengirim & penerima di ROOM
# yang sama (tes 1 & 2 terkirim tapi SkyDev tidak melihat popup sama
# sekali, lalu timeout ~30 dtk). Jangan dipakai untuk order.
# Kredensial bot via input (akun Gmail mandiri, TIDAK ada di panel DB).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pengirim"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      pet_id:
        description: "ID pet yang dikirim (UUID instance)"
        required: true
        default: "b0cad3aa-5e99-410f-a83a-2a3f080b44ea"
      recipient:
        description: "UUID penerima (userId)"
        required: true
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      target_server:
        description: "Nama server target (bagian tengah gameServerId) — kosong = ambil dari alokasi destinationUserId (mode panel)"
        required: false
        default: ""
      target_room:
        description: "Nomor room target — 0 = ambil dari alokasi destinationUserId (mode panel)"
        required: false
        default: "0"
      dest_user_id:
        description: "UUID teman (join server teman via destinationUserId)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      max_alloc_tries:
        description: "Maks percobaan alokasi sampai server cocok"
        required: false
        default: "15"
      wait:
        description: "Tunggu Result maks (detik, penerima konfirmasi dulu)"
        required: false
        default: "60"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u gift_join_room_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --pet-id "${{ inputs.pet_id }}" --recipient "${{ inputs.recipient }}" --target-server "${{ inputs.target_server }}" --target-room "${{ inputs.target_room }}" --dest-user-id "${{ inputs.dest_user_id }}" --max-alloc-tries "${{ inputs.max_alloc_tries }}" --wait "${{ inputs.wait }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
