name: DIAG Outfit Clear — hapus outfit bot ke 0

# Bot login lalu kirim EquipRequest kosong (RoomEvent "equip", Items=[],
# HairModel=0, HairStyle=0, BundleCode=0) untuk menghapus outfit bot.
# SkinColor dipertahankan dari outfit saat ini (GET outfit dulu).
# GET outfit sebelum + sesudah (RoomEvent "outfit", EventId=0) untuk
# verifikasi. Output OUTFIT_CLEAR_JSON:.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot (yang outfitnya dihapus)"
        required: true
        default: "nbp498vu5jnp439rsf@icloud.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u outfit_clear_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
