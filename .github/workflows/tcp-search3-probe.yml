# Diagnostik TCP ToxicBird — TAHAP 8 (lihat tcp_search3_probe.py).
#
# Terobosan: TBLog.txt dari game asli menunjukkan request search
# persisnya — RoomEvent 'friends' (nama varint) + protobuf
# SearchFriendRequest (EventId 7 + FriendName). Tahap 6 gagal
# karena memakai int32 untuk panjang nama; tahap 8 memakai
# encoding persis game.
#
# CARA PAKAI:
# 1. Taruh file ini di: .github/workflows/tcp-search3-probe.yml
# 2. Taruh tcp_search3_probe.py di root repo yang sama.
# 3. Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.
#    FSTR_* untuk sementara di-hardcode di script (uji coba,
#    repo private) — workflow ini sudah meneruskan env-nya, jadi
#    kalau nanti dibuat sebagai Secrets, env menang otomatis.
# 4. Tab Actions -> "TCP Search3 Probe" -> Run workflow ->
#    isi search_name (mis. admin#000) -> baca log: cari baris
#    "HASIL SEARCH DITERIMA!" + UUID. UUID ambient TANPA baris
#    itu BUKAN hasil search.

name: TCP Search3 Probe

on:
  workflow_dispatch:
    inputs:
      search_name:
        description: "Nama pemain yang dicari (boleh nama#kode, mis. admin#000)"
        required: true
        default: "admin#000"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi urllib3

      - name: Run search3 probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          SEARCH_NAME: ${{ inputs.search_name }}
        run: python -u tcp_search3_probe.py
