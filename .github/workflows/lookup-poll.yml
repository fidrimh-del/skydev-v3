# Poller UUID pesanan pkxd.shop (lihat lookup_poll.py + lookup_uuid.py).
# Dijalankan dari repo panel skydev-v3 (runner yang sama dengan
# script panel), bukan dari repo website.
#
# DUA JALUR PEMICU (keduanya menjalankan poller yang sama):
# 1. REAL-TIME (utama): trigger database di tabel orders
#    (trg_order_dispatch) memanggil GitHub repository_dispatch
#    event 'new-order' begitu order baru dengan uuid_status='pending'
#    tersimpan -> workflow jalan dalam ~1 menit, UUID muncul di detail
#    sekitar 1-2 menit setelah order dibuat.
# 2. CRON tiap 10 menit (jaring pengaman): mengambil order pending
#    yang terlewat webhook (mis. dispatch gagal / PAT kedaluwarsa).
#
# PENTING — Secrets repo ini (skydev-v3):
#   SUPABASE_URL / SUPABASE_SERVICE_KEY yang SUDAH ADA di repo ini
#   adalah database PANEL (stok bot), BUKAN database toko.
#   Poller ini memakai nama Secrets BERBEDA agar tidak salah DB:
#     SHOP_SUPABASE_URL, SHOP_SUPABASE_SERVICE_KEY
#   (isi dengan URL + service key proyek Supabase TOKO / PKXDSHOP).
#   Workflow memetakan keduanya ke env SUPABASE_URL /
#   SUPABASE_SERVICE_KEY untuk poller, jadi kode poller tidak berubah.
#   (PROBE_*/FSTR_* diteruskan kalau ada sebagai Secrets; kalau
#   tidak ada, script memakai nilai di lookup_uuid.py atas perintah
#   pemilik — hapus nilai hardcode saat produksi.)
#
# PRASYARAT REAL-TIME (sekali saja, di dashboard Supabase toko):
#   Simpan token GitHub (classic, scope repo) ke Vault:
#     select vault.create_secret('<TOKEN_GITHUB>', 'github_dispatch_pat');
#   Token ini hanya dibaca fungsi trigger di database; tidak pernah
#   keluar dari proyek Supabase. Tanpa secret ini, trigger diam saja
#   dan cron tetap mengambil ordernya (tidak ada yang rusak).
#
# CATATAN: workflow ini TIDAK men-deploy website.

name: Lookup UUID Poller

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [new-order]

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi urllib3

      - name: Run poller
        env:
          SUPABASE_URL: ${{ secrets.SHOP_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SHOP_SUPABASE_SERVICE_KEY }}
          PANEL_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PANEL_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          PROBE_DEVICE_ID: ${{ secrets.PROBE_DEVICE_ID }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
        run: python -u lookup_poll.py
