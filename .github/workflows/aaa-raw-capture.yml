name: DIAG AAA Raw Capture — tangkap bytes mentah 'aaa' dance

# Tangkap bytes protobuf 'aaa' MENTAH pemain yang sedang dance (field 7
# hadir) untuk dibandingkan byte-per-byte dengan 'aaa' buatan bot.
# Bot kirim 'aaa' + field 7 = 43 langsung (57x, run 43332129270) tapi
# Bartes lihat bot TETAP DIAM. build_spawn_aaa mengisi field animasi
# dengan KOORDINAT (f1.f3=21.96, f2.f3=-78.49, f4.f3=-76.42) — warisan
# pendekatan lama yang sudah terbukti salah; 'aaa' asli punya progres
# animasi kecil (0.01-0.2).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pkxdshop"
        required: true
      password:
        description: "Password bot pkxdshop"
        required: true
      device_id:
        description: "Device ID bot (kosong = default probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (SkyDev)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      bot_user_id:
        description: "UUID bot pkxdshop"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      listen:
        description: "Detik merekam (Bartes dance satu gerakan)"
        required: false
        default: "60"
      max_samples:
        description: "Maks sampel protobuf unik"
        required: false
        default: "40"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q aiohttp curl-cffi
      - name: Run AAA raw capture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RAW_EMAIL: ${{ inputs.email }}
          RAW_PASSWORD: ${{ inputs.password }}
          RAW_DEVICE_ID: ${{ inputs.device_id }}
          RAW_DEST_USER_ID: ${{ inputs.dest_user_id }}
          RAW_BOT_USER_ID: ${{ inputs.bot_user_id }}
        run: |
          python -u aaa_raw_capture.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --bot-user-id "${{ inputs.bot_user_id }}" --listen "${{ inputs.listen }}" --max-samples "${{ inputs.max_samples }}"
