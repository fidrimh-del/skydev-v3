name: DIAG Dance Replay — bot kirim ulang 'aaa' dance ASLI

# Isolasi isi vs jalur: bot kirim ULANG bytes protobuf 'aaa' dance ASLI
# (75d2, f7=2757, tangkapan run 43332547192) VERBATIM, hanya ganti prefix
# jadi [00 06 <ID bot>]. Bila Bartes lihat bot dance -> ISI 'aaa' bot
# yang salah (koordinat di field animasi), jalur kirim berfungsi.
# Bila bot TETAP DIAM -> bahkan 'aaa' asli pun tak jalan lewat 'tbulv'
# bot, ada yang lebih dalam.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pkxdshop"
        required: true
      password:
        description: "Password bot pkxdshop"
        required: true
      device_id:
        description: "Device ID bot (kosong = default probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (SkyDev)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      bot_user_id:
        description: "UUID bot pkxdshop"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      dance_s:
        description: "Detik bot replay dance"
        required: false
        default: "30"
      idle_s:
        description: "Detik bot diam sesudahnya"
        required: false
        default: "10"
      start_x:
        description: "X awal Bartes"
        required: false
        default: "-79.99"
      start_y:
        description: "Y awal Bartes"
        required: false
        default: "21.96"
      start_z:
        description: "Z awal Bartes"
        required: false
        default: "-76.42"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q aiohttp curl-cffi
      - name: Run dance replay
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPLAY_EMAIL: ${{ inputs.email }}
          REPLAY_PASSWORD: ${{ inputs.password }}
          REPLAY_DEVICE_ID: ${{ inputs.device_id }}
          REPLAY_DEST_USER_ID: ${{ inputs.dest_user_id }}
          REPLAY_BOT_USER_ID: ${{ inputs.bot_user_id }}
        run: |
          python -u dance_replay_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --bot-user-id "${{ inputs.bot_user_id }}" --dance-s "${{ inputs.dance_s }}" --idle-s "${{ inputs.idle_s }}" --start-x "${{ inputs.start_x }}" --start-y "${{ inputs.start_y }}" --start-z "${{ inputs.start_z }}"
