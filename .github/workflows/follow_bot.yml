name: SKYDEV Follow Engine (Cloud)

on:
  workflow_dispatch:
    inputs:
      target_uuid:
        description: 'UUID Target'
        required: true
      jumlah_order:
        description: 'Jumlah Follower'
        required: true
        default: '100'
      bot_type:
        description: 'Tipe bot: accounts (tanpa nama) atau named_bots (bernama)'
        required: false
        default: 'accounts'

jobs:
  suntik_follow:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode Repo
        uses: actions/checkout@v4
        
      - name: Siapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        # PERBAIKAN: Dihapus aiofiles, karena sudah murni database
        run: pip install curl_cffi==0.16.0 requests==2.34.2 typing_extensions==4.16.0
        
      - name: Eksekusi Follow Pintar V3
        # PERBAIKAN: Masukkan token Supabase agar script bisa komunikasi ke DB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOT_TYPE: ${{ github.event.inputs.bot_type }}
        run: python follow_cloud.py ${{ github.event.inputs.target_uuid }} ${{ github.event.inputs.jumlah_order }}
        
      # PERBAIKAN: Tahap "Simpan Data ke GitHub" (git add, git commit, git push) 
      # telah DIHAPUS TOTAL. Data riwayat follow sudah otomatis tersimpan ke tabel Supabase.
