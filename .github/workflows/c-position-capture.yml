name: DIAG C Position Capture — tangkap relay posisi 'C'

# Tangkap event 'C' (posisi) yang diteruskan server untuk memahami format
# relay sebelum tes follow: 450 event 'C' terlihat di tangkapan dance,
# format relay (92 byte, terkompresi?) belum dipahami.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pkxdshop"
        required: true
      password:
        description: "Password bot pkxdshop"
        required: true
      device_id:
        description: "Device ID bot (kosong = default probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (SkyDev)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      bot_user_id:
        description: "UUID bot pkxdshop"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      listen:
        description: "Detik menangkap"
        required: false
        default: "30"
      max_samples:
        description: "Maks sampel 'C' yang disimpan"
        required: false
        default: "60"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q aiohttp curl-cffi
      - name: Run C position capture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CPOS_EMAIL: ${{ inputs.email }}
          CPOS_PASSWORD: ${{ inputs.password }}
          CPOS_DEVICE_ID: ${{ inputs.device_id }}
          CPOS_DEST_USER_ID: ${{ inputs.dest_user_id }}
          CPOS_BOT_USER_ID: ${{ inputs.bot_user_id }}
        run: |
          python -u c_position_capture.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --bot-user-id "${{ inputs.bot_user_id }}" --listen "${{ inputs.listen }}" --max-samples "${{ inputs.max_samples }}"
