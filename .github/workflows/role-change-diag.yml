name: DIAG Role Change — bot ubah role jadi CreatorUgc

# Tes role (2026-11-12, Bartes): bot pkxdshop join server SkyDev di world
# utama (Plaza), kirim role "D"=CreatorUgc (4) + tier "rt"=Legendary (3)
# sebagai user variable ByteVariable via RoomEvent 'uv' dengan pembungkus
# biner yang BENAR ([BE32(name_len)][nama][tag+nilai]) — BUKAN protobuf
# (wrapper protobuf lama SALAH dan diabaikan server). Bot tetap online
# 90 dtk supaya Bartes (SkyDev) bisa cek di game apakah bot tampil
# sebagai CreatorUgc. Verdict utama = cek in-game Bartes.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (SkyDev)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      bot_user_id:
        description: "UUID bot"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      role:
        description: "Nilai role (4=CreatorUgc)"
        required: false
        default: "4"
      tier:
        description: "Nilai tier (3=Legendary)"
        required: false
        default: "3"
      device_event:
        description: "Nama event SendDeviceId"
        required: false
        default: "deviceid"
      uv_event:
        description: "Nama event user variable"
        required: false
        default: "uv"
      listen:
        description: "Bot online berapa detik (Bartes cek role)"
        required: false
        default: "90"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u role_change_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --bot-user-id "${{ inputs.bot_user_id }}" --role "${{ inputs.role }}" --tier "${{ inputs.tier }}" --device-event "${{ inputs.device_event }}" --uv-event "${{ inputs.uv_event }}" --listen "${{ inputs.listen }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
