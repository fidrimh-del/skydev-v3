name: DIAG Friend Join UGC — bot join instance teman via destinationUserId

# Tes join TEMAN ke world UGC (ide Bartes 2026-11-13): alokasi activity
# TIDAK menjamin bot satu server/instance dengan Bartes, walau world-nya
# sama. Tes ini pakai alokasi destinationUserId (POST /lobby/allocation
# + destinationUserId = UUID Bartes/SkyDev, pemilik world) — cara yang
# dipakai semua tes Sekolah/Plaza yang TERBUKTI menaruh bot di
# server/instance target — DITAMBAH init activity (init_pos,
# init_day_night, preset, fetch_events, activity/get), SendDeviceId,
# 'tbulv', dengar 'C' 10 dtk, spawn di posisi pemain paling sering
# terlihat (+1.5 X) atau fallback (0,2,0), heartbeat 'C' 1 dtk +
# 'tbulv' 5 dtk selama listen (default 60).
# Verdict utama = mata Bartes di dalam world (apakah bot terlihat).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pkxdshop"
        required: true
      password:
        description: "Password bot pkxdshop"
        required: true
      device_id:
        description: "Device ID bot (kosong = default probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID teman (default: SkyDev#431, pemilik world)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      bot_user_id:
        description: "UUID bot pkxdshop"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      listen:
        description: "Detik bot di dalam world sesudah spawn"
        required: false
        default: "60"
      fallback_x:
        description: "Fallback spawn X (bila 'C' kosong)"
        required: false
        default: "0"
      fallback_y:
        description: "Fallback spawn Y"
        required: false
        default: "2"
      fallback_z:
        description: "Fallback spawn Z"
        required: false
        default: "0"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q aiohttp curl-cffi
      - name: Run friend join test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRIEND_JOIN_EMAIL: ${{ inputs.email }}
          FRIEND_JOIN_PASSWORD: ${{ inputs.password }}
          FRIEND_JOIN_DEVICE_ID: ${{ inputs.device_id }}
          FRIEND_JOIN_DEST_USER_ID: ${{ inputs.dest_user_id }}
          FRIEND_JOIN_BOT_USER_ID: ${{ inputs.bot_user_id }}
        run: |
          python -u friend_join_ugc_diag.py \
            --email "${{ inputs.email }}" \
            --password "${{ inputs.password }}" \
            --device-id "${{ inputs.device_id }}" \
            --dest-user-id "${{ inputs.dest_user_id }}" \
            --bot-user-id "${{ inputs.bot_user_id }}" \
            --listen "${{ inputs.listen }}" \
            --fallback-x "${{ inputs.fallback_x }}" \
            --fallback-y "${{ inputs.fallback_y }}" \
            --fallback-z "${{ inputs.fallback_z }}"
