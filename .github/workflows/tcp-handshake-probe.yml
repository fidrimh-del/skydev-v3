# Diagnostik TCP ToxicBird — TAHAP 2 (lihat tcp_handshake_probe.py).
#
# CARA PAKAI:
# 1. Taruh file ini di: .github/workflows/tcp-handshake-probe.yml
# 2. Taruh tcp_handshake_probe.py di root repo yang sama.
# 3. Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY.
#    FSTR_* untuk sementara di-hardcode di script (uji coba,
#    repo private) — workflow ini sudah meneruskan env-nya, jadi
#    kalau nanti dibuat sebagai Secrets, env menang otomatis.
# 4. Tab Actions -> "TCP Handshake Probe" -> Run workflow ->
#    laporkan tabel ringkasan + baris type yang berbunyi balasan.

name: TCP Handshake Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi urllib3

      - name: Run handshake probe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
        # -u = output tanpa buffer, supaya tiap baris probe tampil
        # live di log (tanpa ini, log baru muncul bergerombol di akhir).
        run: python -u tcp_handshake_probe.py
