# Diagnostik TCP ToxicBird — TAHAP 14 / AKUN FULL IDENTITAS (lihat tcp_search9_probe.py).
#
# Hipotesis yang diuji: stok bot gagal karena akunnya (fresh /
# tidak lengkap), bukan karena protokol. Probe ini memakai SATU
# akun bot beridentitas penuh dari Secrets, BUKAN get_fresh_bots.
#
# KEAMANAN — BACA DULU:
# 1. Buat 3 Secrets di repo (Settings -> Secrets and variables
#    -> Actions -> New repository secret):
#      PROBE_EMAIL, PROBE_PASSWORD, PROBE_DEVICE_ID
#    PROBE_DEVICE_ID boleh string stabil apa pun (mis. UUID);
#    kalau tidak diisi, script memakai default internal.
# 2. JANGAN PERNAH menulis password ke script, workflow, issue,
#    atau log. GitHub otomatis menyensor nilai Secrets di log.
# 3. Probe ini READ-ONLY: login + search saja. Tidak follow,
#    tidak tulis history, tidak mengubah apa pun di akun.
#
# CARA PAKAI:
# 1. Taruh file ini di: .github/workflows/tcp-search9-probe.yml
# 2. Taruh tcp_search9_probe.py di root repo yang sama.
# 3. Tab Actions -> "TCP Search9 Probe" -> Run workflow ->
#    isi search_name (mis. admin#000) -> baca log: cari
#    "HASIL SEARCH DITERIMA" (via UDP/TCP) + UUID.
#    Kirim seluruh log ke Muse.

name: TCP Search9 Probe

on:
  workflow_dispatch:
    inputs:
      search_name:
        description: "Nama pemain yang dicari (boleh nama#kode, mis. admin#000)"
        required: true
        default: "admin#000"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi urllib3

      - name: Run search9 probe
        env:
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          PROBE_DEVICE_ID: ${{ secrets.PROBE_DEVICE_ID }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          SEARCH_NAME: ${{ inputs.search_name }}
        run: python -u tcp_search9_probe.py
