name: DIAG Gift Pet Multi (1 bot, berurutan)

# Multi-gift: 1 bot alokasi destinationUserId -> JoinRoom target ->
# kirim BANYAK pet BERURUTAN dalam satu koneksi. Per pet: kirim gift ->
# tunggu konfirmasi penerima (popup ~30 dtk) -> bila DITERIMA lanjut ke
# pet berikut; bila DITOLAK / timeout, kirim ULANG pet yang sama
# (maks max-retries kali) sebelum lanjut. Bila tetap gagal, pet itu
# dicatat "failed" dan lanjut ke pet berikut (tidak memblokir sisanya).
# Dibuat 2026-11-10 atas permintaan Bartes (multi-select gift di panel).
# Kredensial bot via input (akun Gmail mandiri, TIDAK ada di panel DB).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pengirim"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      pet_ids:
        description: "Daftar ID pet dipisah koma, sesuai urutan dipilih"
        required: true
        default: ""
      recipient:
        description: "UUID penerima (userId)"
        required: true
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      target_server:
        description: "Nama server target (bagian tengah gameServerId) — kosong = ambil dari alokasi destinationUserId (mode panel)"
        required: false
        default: ""
      target_room:
        description: "Nomor room target — 0 = ambil dari alokasi destinationUserId (mode panel)"
        required: false
        default: "0"
      dest_user_id:
        description: "UUID teman (join server teman via destinationUserId)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      max_alloc_tries:
        description: "Maks percobaan alokasi sampai server cocok"
        required: false
        default: "15"
      wait:
        description: "Tunggu konfirmasi per percobaan (detik, popup ~30 dtk)"
        required: false
        default: "35"
      max_retries:
        description: "Kirim ulang pet yang ditolak/timeout (maks per pet)"
        required: false
        default: "2"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u gift_multi_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --pet-ids "${{ inputs.pet_ids }}" --recipient "${{ inputs.recipient }}" --target-server "${{ inputs.target_server }}" --target-room "${{ inputs.target_room }}" --dest-user-id "${{ inputs.dest_user_id }}" --max-alloc-tries "${{ inputs.max_alloc_tries }}" --wait "${{ inputs.wait }}" --max-retries "${{ inputs.max_retries }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
