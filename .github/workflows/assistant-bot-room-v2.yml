# Assistant Bot (2 menit) — join pasif + unpack Batch + activity-get activity-tier (manual, sekali jalan).
# Kriteria sukses (dari pemilik): history join UGC target 6 -> 7.
# Bot: akun probe (fallback hardcode di lookup_uuid.py atas perintah pemilik,
# repo private); Secrets FSTR_*/PROBE_* menang kalau ada.
# Log run SENGAJA tidak dihapus (bukti join).
name: Assistant Bot Room v2 (alokasi umum + AllocateToRoomId)
on:
  workflow_dispatch:
    inputs:
      x:
        description: "Target X"
        required: false
        default: "8.31"
      y:
        description: "Target Y"
        required: false
        default: "22.13"
      z:
        description: "Target Z"
        required: false
        default: "-66.42"
      rot:
        description: "Target rotasi"
        required: false
        default: "319.3"
      udp_host:
        description: "Host UDP (opsional; kosong = pakai host TCP koneksi #2)"
        required: false
        default: ""
      udp_port:
        description: "Port UDP (opsional; kosong = pakai port TCP koneksi #2)"
        required: false
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u assistant_bot_room_v2.py
        env:
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          BOT_X: ${{ inputs.x }}
          BOT_Y: ${{ inputs.y }}
          BOT_Z: ${{ inputs.z }}
          BOT_ROT: ${{ inputs.rot }}
          BOT_UDP_HOST: ${{ inputs.udp_host }}
          BOT_UDP_PORT: ${{ inputs.udp_port }}
