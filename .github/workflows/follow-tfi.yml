name: DIAG Follow tfi — kirim TargetFriendId dari bot

# Tes kirim "tfi" (TargetFriendId) dari bot (bukan produksi).
# Bot join server SkyDev, lalu kirim RoomEvent "tbulv" berisi user
# variable "tfi" = UUID SkyDev, dengan 4 kandidat encoding string
# (tag 00/01/03/05), jeda 8 dtk. Bartes (online) melihat apakah
# bot muncul/teleport ke dekatnya dan kapan.
# Dibuat 2026-11-09 atas permintaan Bartes. TIDAK kirim posisi.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (teman yang diikuti)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u follow_tfi.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
