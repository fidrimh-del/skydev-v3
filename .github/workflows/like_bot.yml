name: SKYDEV Post Engine (Cloud)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operasi: GET (Ambil Data) atau LIKE (Eksekusi)'
        required: true
        default: 'GET'
      target_data:
        description: 'UUID User (GET) atau Kumpulan Post ID (LIKE)'
        required: true
      jumlah_bot:
        description: 'Jumlah Bot (Hanya dipakai untuk mode LIKE)'
        required: false
        default: '50'

jobs:
  operasi_postingan:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Hanya butuh ini untuk menghapus log Actions (contents: write dihapus!)
    steps:
      - name: Ambil Kode Repo
        uses: actions/checkout@v4
        
      - name: Siapkan Mesin Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Senjata (Dependencies)
        # PERBAIKAN: Dihapus aiofiles dan supabase (karena kita pakai REST API native yang super ringan)
        run: pip install curl_cffi==0.16.0 requests==2.34.2 typing_extensions==4.16.0
        
      - name: Tembak Server PK XD
        # PERBAIKAN: Gunakan SERVICE_KEY agar script python punya hak penuh menulis ke Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python like_cloud.py ${{ github.event.inputs.mode }} "${{ github.event.inputs.target_data }}" ${{ github.event.inputs.jumlah_bot }}
        
      # PERBAIKAN: Langkah "Simpan Hasil Kerja ke GitHub" DIHAPUS TOTAL! 
      # Data otomatis mengalir ke Supabase tanpa membebani repository.

      - name: Sapu Bersih Log Server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --status completed --limit 15 --json databaseId -q '.[].databaseId' | xargs -I{} gh run delete {} || true
