name: DIAG Spawn — bot spawn normal di titik spawn

# Tes spawn: bot login -> alokasi destinationUserId (SkyDev) -> JoinRoom
# -> kirim SATU frame "aaa" berisi titik spawn tetap (Central Square),
# sekali saja. TIDAK ada loop, TIDAK ada koordinat live pemain.
# Titik spawn default dari CoordLog v3 (Bartes 2026-11-09 22:11).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (teman)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      spawn_x:
        description: "Titik spawn X"
        required: false
        default: "79.96"
      spawn_y:
        description: "Titik spawn Y"
        required: false
        default: "27.13"
      spawn_z:
        description: "Titik spawn Z"
        required: false
        default: "-122.17"
      listen:
        description: "Dengarkan berapa detik sesudah spawn"
        required: false
        default: "15"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u spawn_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --spawn-x "${{ inputs.spawn_x }}" --spawn-y "${{ inputs.spawn_y }}" --spawn-z "${{ inputs.spawn_z }}" --listen "${{ inputs.listen }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
