name: DIAG Like Rumah Verbose (1 leg)

# Diag sekali jalan (bukan produksi): 1 leg, 25 bot, log verbose.
# Tujuannya membedakan gagal JOIN vs gagal IsThere pada like rumah.
# Dibuat 2026-11-07 atas permintaan Bartes. Jangan dipakai untuk order.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target: UUID pemilik rumah"
        required: true
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      jumlah:
        description: "Jumlah bot diag"
        required: false
        default: "25"
      max_paralel:
        description: "Worker bersamaan (maks 12)"
        required: false
        default: "12"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u house_diag_verbose.py "${{ inputs.target }}" "${{ inputs.jumlah }}" "${{ inputs.max_paralel }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOT_TYPE: accounts
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
FSTR_APP_SECRET: <redacted>
