name: DIAG Dance Mirror — bot tiru dance Bartes (relay 'aaa')

# Bot menirukan dance Bartes: relay seluruh bytes protobuf 'aaa' Bartes
# (field 7 = ReactionIndex, TERKONFIRMASI run 43331214520: pid 72a9 f7=43,
# 65 frame) sebagai 'tbulv' bot, sambil berdiri di sampingnya via 'C'.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pkxdshop"
        required: true
      password:
        description: "Password bot pkxdshop"
        required: true
      device_id:
        description: "Device ID bot (kosong = default probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (SkyDev)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      bot_user_id:
        description: "UUID bot pkxdshop"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      duration:
        description: "Detik mirror (Bartes dance lalu diam)"
        required: false
        default: "60"
      start_x:
        description: "X awal Bartes"
        required: false
        default: "-79.99"
      start_y:
        description: "Y awal Bartes"
        required: false
        default: "21.96"
      start_z:
        description: "Z awal Bartes"
        required: false
        default: "-76.42"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q aiohttp curl-cffi
      - name: Run dance mirror
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MIRROR_EMAIL: ${{ inputs.email }}
          MIRROR_PASSWORD: ${{ inputs.password }}
          MIRROR_DEVICE_ID: ${{ inputs.device_id }}
          MIRROR_DEST_USER_ID: ${{ inputs.dest_user_id }}
          MIRROR_BOT_USER_ID: ${{ inputs.bot_user_id }}
        run: |
          python -u dance_mirror_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --bot-user-id "${{ inputs.bot_user_id }}" --duration "${{ inputs.duration }}" --start-x "${{ inputs.start_x }}" --start-y "${{ inputs.start_y }}" --start-z "${{ inputs.start_z }}"
