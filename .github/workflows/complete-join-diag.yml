name: DIAG Complete Join — bot kirim deviceid + user variable + gendong

# Eksperimen Sekolah (2026-11-12, Bartes): bot kirim SET LENGKAP sesudah
# join — SendDeviceId (RoomEvent 'deviceid', deviceId UTF-8) + satu user
# variable (RoomEvent 'uv', bool "subscriber"=true) — lalu invite gendong
# + ACC telat. Tujuannya: apakah server activity mulai menyiarkan bot
# (RoomUserUpdate) sesudah pesan-pesan ini, dan apakah Bartes melihat
# wujud bot / tergendong di Sekolah. Disassembly dump BARU membuktikan
# GetExistingPlayers TIDAK kirim apa pun ke server (lokal saja); deviceid
# + 'uv' adalah dua hal yang client asli kirim dan bot tidak pernah kirim.
# Deteksi RoomUserUpdate = heuristik (frame berisi UUID target/bot, atau
# event name baru). Verdict utama = cek in-game Bartes.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (kontol)"
        required: false
        default: "c6c271e0-a3d9-4a93-bf64-1c715d1b7fbb"
      bot_user_id:
        description: "UUID bot"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      device_event:
        description: "Nama event SendDeviceId"
        required: false
        default: "deviceid"
      uv_event:
        description: "Nama event user variable"
        required: false
        default: "uv"
      uv_name:
        description: "Nama variabel user"
        required: false
        default: "subscriber"
      invite_wait:
        description: "Tunggu berapa detik sebelum ACC telat"
        required: false
        default: "6"
      listen:
        description: "Dengarkan berapa detik total (fase carry)"
        required: false
        default: "60"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u complete_join_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --bot-user-id "${{ inputs.bot_user_id }}" --device-event "${{ inputs.device_event }}" --uv-event "${{ inputs.uv_event }}" --uv-name "${{ inputs.uv_name }}" --invite-wait "${{ inputs.invite_wait }}" --listen "${{ inputs.listen }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
