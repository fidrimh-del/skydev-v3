# SKYDEV Activity Join-Leave (Test) — FILE BARU.
# Uji coba: bot JOIN world UGC lalu langsung KELUAR (disconnect).
# Pertanyaan: apakah counter TOTAL JOIN bertambah dari join singkat saja?
# Script di folder test-activity/ (folder khusus tes di skydev-v3).
# File standby (activity_standby.py + activity-standby.yml) TIDAK diubah.
# TIDAK menulis histori apa pun — bot tidak terpakai.
# Prasyarat: Secrets SUPABASE_URL + SUPABASE_SERVICE_KEY
# (DB PANEL) + FSTR_APP_KEY/FSTR_APP_SECRET
# (boleh kosong -> fallback di lookup_uuid.py).
name: SKYDEV Activity Join-Leave (Test)
on:
  workflow_dispatch:
    inputs:
      activity_id:
        description: "ActivityId world UGC (dari log mod v18)"
        required: true
      jumlah:
        description: "Jumlah bot join-leave"
        required: false
        default: "5"
      bot_type:
        description: "Tipe bot: named_bots atau accounts"
        required: false
        default: "named_bots"
      tahan_detik:
        description: "Tahan berapa detik setelah MASUK sebelum keluar (0 = langsung)"
        required: false
        default: "0"
jobs:
  joinleave:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u test-activity/activity_joinleave.py "${{ inputs.activity_id }}" "${{ inputs.jumlah }}" "${{ inputs.bot_type }}" "${{ inputs.tahan_detik }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
