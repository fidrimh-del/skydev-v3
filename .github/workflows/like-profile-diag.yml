# SKYDEV Like Profil DIAGNOSA (file terpisah) — diagnosis like profil
# via like_profile_diag.py, BUKAN via like_profile_cloud.py.
#
# Dibuat 2026-11-04 atas permintaan Bartes: diagnosis di file TERPISAH
# supaya file produksi like profil (like_profile_cloud.py dan
# like_profile_probe.py) TIDAK disentuh dan order dadakan tidak
# terganggu. Workflow ini HANYA menjalankan file diagnosa; workflow
# produksi like-profile.yml tidak diubah dan tidak dipanggil dari sini.
#
# Yang diukur: (1) LOGIKA — langkah mana yang gagal per bot + apakah
# balasan Create (create_like_result) tertangkap; (2) KECEPATAN —
# durasi tiap fase per bot + waktu total run. Blok HASIL DIAG di log
# adalah bukti diagnosa. Job ini selalu exit 0 bila run selesai
# (0 terkirim tetap hasil diagnosa yang sah, bukan failure).
#
# Prasyarat: Secrets skydev-v3 SUPABASE_URL + SUPABASE_SERVICE_KEY
# (DB PANEL) + FSTR_APP_KEY/FSTR_APP_SECRET (boleh kosong -> fallback
# di lookup_uuid.py). Bot gagal TIDAK ditulis ke histori (sama seperti
# produksi), jadi tes ini tidak membuang stok.
name: SKYDEV Like Profil DIAGNOSA (file terpisah)
on:
  workflow_dispatch:
    inputs:
      target_uuid:
        description: "Target UUID (diagnosa ke UUID ini)"
        required: true
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      jumlah:
        description: "Jumlah bot diagnosa"
        required: true
        default: "50"
      max_paralel:
        description: "Worker bersamaan (maks 50)"
        required: false
        default: "50"
      bot_type:
        description: "Tipe bot: accounts atau named_bots"
        required: false
        default: "accounts"
jobs:
  like_profil_diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u like_profile_diag.py "${{ inputs.target_uuid }}" "${{ inputs.jumlah }}" "${{ inputs.max_paralel }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOT_TYPE: ${{ inputs.bot_type }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
