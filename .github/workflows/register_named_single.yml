name: Register Named Bot (TEST SINGLE)

on:
  workflow_dispatch:
    inputs:
      jumlah:
        description: 'Total jumlah bot yang dibuat (dibagi ke 20 runner)'
        required: false
        default: '20'
      workers:
        description: 'Paralel workers per runner'
        required: false
        default: '20'

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install curl_cffi


      - name: Register + Nickname
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JUMLAH: ${{ inputs.jumlah }}
          WORKERS: ${{ inputs.workers }}
        run: python register_named.py
