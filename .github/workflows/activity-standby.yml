# SKYDEV Activity Standby (TEST REPO ONLY — bukan skydev-v3).
# Uji coba: bot online & muncul di world UGC/builder (activity),
# Script di folder test-activity/ (folder khusus tes di skydev-v3).
# lalu tahan koneksi selama durasi agar terlihat di dalam world.
# TIDAK menulis histori apa pun — bot tidak terpakai.
# Prasyarat: Secrets skydev-test SUPABASE_URL + SUPABASE_SERVICE_KEY
# (DB PANEL, sama seperti skydev-v3) + FSTR_APP_KEY/FSTR_APP_SECRET
# (boleh kosong -> fallback di lookup_uuid.py).
name: SKYDEV Activity Standby (Test)
on:
  workflow_dispatch:
    inputs:
      activity_id:
        description: "ActivityId world UGC (dari deeplink/nama world)"
        required: true
      jumlah:
        description: "Jumlah bot standby"
        required: false
        default: "5"
      durasi_menit:
        description: "Durasi standby (menit, maks 100)"
        required: false
        default: "60"
      bot_type:
        description: "Tipe bot: named_bots atau accounts"
        required: false
        default: "named_bots"
jobs:
  standby:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u test-activity/activity_standby.py "${{ inputs.activity_id }}" "${{ inputs.jumlah }}" "${{ inputs.durasi_menit }}" "${{ inputs.bot_type }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
