# SKYDEV Like Profil DIAGNOSA Login (frame jendela login) — file terpisah
#
# Dibuat 2026-11-04 atas permintaan Bartes: melihat respon server saat
# login (berhasil/gagal) via like_profile_diag_login.py, BUKAN via
# file produksi (like_profile_cloud.py / like_profile_probe.py).
# Workflow ini HANYA menjalankan file diagnosa login; workflow
# produksi tidak diubah/dipanggil.
#
# Yang direkam: seluruh frame yang DITERIMA selama jendela login
# (wait-login produksi: maks 3 detik sampai tbugv/JoinedRoom + 1 detik
# observasi auto-join), plus pemisahan outcome "wait-closed"
# (koneksi tertutup saat wait-login) dari fail-noanswer biasa.
# Frame yang dikirim (login frame berisi JWT) TIDAK PERNAH dicetak.
# Bot gagal TIDAK ditulis ke histori (sama seperti produksi), jadi
# tes ini tidak membuang stok.
name: SKYDEV Like Profil DIAGNOSA Login (file terpisah)
on:
  workflow_dispatch:
    inputs:
      target_uuid:
        description: "Target UUID (diagnosa ke UUID ini)"
        required: true
        default: "f08ba1ba-1110-4bee-9584-11e05200f74e"
      jumlah:
        description: "Jumlah bot diagnosa"
        required: true
        default: "50"
      max_paralel:
        description: "Worker bersamaan (maks 50)"
        required: false
        default: "20"
      bot_type:
        description: "Tipe bot: accounts atau named_bots"
        required: false
        default: "accounts"
jobs:
  like_profil_diag_login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u like_profile_diag_login.py "${{ inputs.target_uuid }}" "${{ inputs.jumlah }}" "${{ inputs.max_paralel }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BOT_TYPE: ${{ inputs.bot_type }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
