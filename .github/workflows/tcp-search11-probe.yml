# Diagnostik TCP ToxicBird — TAHAP 16 / DECODE HASIL + DUA KAPITALISASI
# (lihat tcp_search11_probe.py).
#
# Koreksi atas tahap 15: server sebenarnya MENJAWAB (tbugv,
# auto-join, get_friends_result, search_friend_result 2x per
# instance) — tapi scanner probe menolak frame hasil karena
# mensyaratkan nama persis ("admin#000" lowercase vs kanonis
# "Admin#000"), dan isinya tidak pernah dicetak. Probe ini
# men-decode + mencetak setiap frame hasil (Success, UUID, nama
# kanonis, pesan error) dan menguji dua varian kapitalisasi.
#
# Akun: akun bot pemilik (fallback hardcode di script atas
# perintah pemilik; env Secrets menang kalau ada).
#
# CARA PAKAI:
# 1. Taruh file ini di: .github/workflows/tcp-search11-probe.yml
# 2. Taruh tcp_search11_probe.py di root repo yang sama.
# 3. Tab Actions -> "TCP Search11 Probe" -> Run workflow ->
#    isi search_name (boleh apa adanya, mis. admin#000) ->
#    baca log: cari "HASIL DECODE" dan "HASIL SEARCH DITERIMA".
#    Kirim seluruh log ke Muse.

name: TCP Search11 Probe

on:
  workflow_dispatch:
    inputs:
      search_name:
        description: "Nama pemain yang dicari (boleh nama#kode, mis. admin#000)"
        required: true
        default: "admin#000"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi urllib3

      - name: Run search11 probe
        env:
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
          PROBE_DEVICE_ID: ${{ secrets.PROBE_DEVICE_ID }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          SEARCH_NAME: ${{ inputs.search_name }}
        run: python -u tcp_search11_probe.py
