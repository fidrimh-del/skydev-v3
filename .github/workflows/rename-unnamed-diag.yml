name: DIAG Rename — beri nama ke akun bot tanpa nama

# Login ke akun bot TANPA NAMA (sudah ada, login email), beri nama via TCP.
# Dicoba berurutan: UpdateNickname (EventId 9, jalur ganti nama akun lama),
# lalu SetNickname + device, lalu Set tanpa field EventId.
# Dipakai untuk tes dugaan Bartes 2026-11-12: daftar teman SkyDev kosong
# karena akun tanpa nama yang di-accept.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot tanpa nama"
        required: true
        default: "33e8a45c033845b2@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      name:
        description: "Nama baru untuk bot (Latin+angka, maks 10 karakter)"
        required: true
        default: "CarryBot7"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u rename_unnamed_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --name "${{ inputs.name }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
