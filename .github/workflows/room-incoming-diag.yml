# Diagnostik trafik MASUK koneksi #2 jalur room (30 dtk, tanpa posisi, tanpa init UDP).
# Bot: akun probe (fallback hardcode di lookup_uuid.py atas perintah pemilik,
# repo private); Secrets FSTR_*/PROBE_* menang kalau ada.
# Log run SENGAJA tidak dihapus (bukti).
name: Room Incoming Diag (30 dtk)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u room_incoming_diag.py
        env:
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
FSTR_APP_SECRET: <redacted>
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
PROBE_PASSWORD: <redacted>
