name: DIAG Tbulv Capture — tangkap frame posisi asli pemain lain

# Tangkap frame 'tbulv' ASLI dari pemain lain (2026-11-12, Bartes):
# bot kirim posisi spawn town square via frame "aaa" (sekali + heartbeat)
# tapi tetap di bawah tanah — berarti isi frame "aaa" SALAH. Diag ini
# hanya MENDENGAR (tidak kirim posisi spawn) dan menangkap frame tbulv
# mentah dari pemain lain di room yang sama, lalu membongkar struktur
# protobuf-nya agar bisa dibandingkan byte-per-byte dengan frame bot.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pkxdshop"
        required: true
      password:
        description: "Password bot pkxdshop"
        required: true
      device_id:
        description: "Device ID bot (kosong = default probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (SkyDev)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      bot_user_id:
        description: "UUID bot pkxdshop"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      listen:
        description: "Detik mendengarkan tbulv"
        required: false
        default: "25"
      max_frames:
        description: "Jumlah frame tbulv yang ditangkap"
        required: false
        default: "5"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q aiohttp curl-cffi
      - name: Run tbulv capture
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TBULV_EMAIL: ${{ inputs.email }}
          TBULV_PASSWORD: ${{ inputs.password }}
          TBULV_DEVICE_ID: ${{ inputs.device_id }}
          TBULV_DEST_USER_ID: ${{ inputs.dest_user_id }}
          TBULV_BOT_USER_ID: ${{ inputs.bot_user_id }}
        run: |
          python -u tbulv_capture_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --bot-user-id "${{ inputs.bot_user_id }}" --listen "${{ inputs.listen }}" --max-frames "${{ inputs.max_frames }}"
