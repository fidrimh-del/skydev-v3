name: DIAG Friend BreakUp — bot unfriend pemain

# Bot login lalu kirim BreakUp / unfriend (RoomEvent "friends", f1=5)
# ke UUID target. Dipakai atas perintah Bartes (2026-11-12): bot bernama
# 늑 (yang dulu add friend SkyDev dan DITERIMA) unfriend SkyDev, untuk
# menguji dugaan bahwa koneksi pertemanan yang "tidak lengkap" itulah
# yang merusak daftar teman (SkyDev tampil kosong, permintaan tidak muncul
# di kontol juga). KONSEKUENSI: pertemanan bot <-> target DIHAPUS.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot (bot bernama neuk)"
        required: true
        default: "nbp498vu5jnp439rsf@icloud.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot"
        required: false
        default: "fa39792c97a49024"
      target_user_id:
        description: "UUID target (yang di-unfriend)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      listen:
        description: "Dengarkan hasil berapa detik"
        required: false
        default: "30"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u friend_breakup_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --target-user-id "${{ inputs.target_user_id }}" --listen "${{ inputs.listen }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
