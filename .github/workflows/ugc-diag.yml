# UGC Diagnostic Run — rekam semua frame pasca-join activity room (manual).
# Tujuan: melihat apa yang dikirim server sebelum menutup koneksi bot
# (v1 tutup sesudah auto-join; v2 tutup sesudah activity/get tanpa balasan).
# Log run SENGAJA tidak dihapus (bukti diagnostik).
name: UGC Diagnostic
on:
  workflow_dispatch:
    inputs:
      activity_id:
        description: "ActivityId UGC target"
        required: true
        default: "3e7cec3f-1ae9-4ba2-a19b-a6339e0f9b23"
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u ugc_diag.py "${{ inputs.activity_id }}"
        env:
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
