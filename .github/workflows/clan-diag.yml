name: clan-diag

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email akun bot"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password akun bot"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      clan:
        description: "Nama clan target"
        required: false
        default: "biackhat"
      clan_id:
        description: "Clan ID (dari log mod) — kalau diisi, SearchClan dilewati"
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - name: Jalankan diag join clan
        env:
          CLAN_EMAIL: ${{ inputs.email }}
          CLAN_PASSWORD: ${{ inputs.password }}
          CLAN_DEVICE_ID: ${{ inputs.device_id }}
          CLAN_NAME: ${{ inputs.clan }}
          CLAN_ID: ${{ inputs.clan_id }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
        run: python clan_diag.py
