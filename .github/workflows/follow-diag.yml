name: DIAG Follow Posisi (1 bot)

# Diag sekali jalan (bukan produksi): 1 bot login -> alokasi
# destinationUserId (server teman SkyDev) -> JoinRoom -> tangkap SEMUA
# frame mentah selama N detik, log tipe + panjang + preview hex.
# Tujuannya: identifikasi frame apa yang membawa update posisi pemain
# lain (SkyDev) + formatnya — langkah 1 menuju bot follow.
# Bot TIDAK bergerak / TIDAK kirim posisi di diag ini.
# Dibuat 2026-11-09 atas permintaan Bartes (tes bot teman bermain).
# Target HARUS online + bergerak di game selama tes. Jangan dipakai
# untuk order. Kredensial bot via input (akun Gmail mandiri).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (teman yang diikuti)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      capture_seconds:
        description: "Lama tangkap frame (detik)"
        required: false
        default: "60"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u follow_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --capture-seconds "${{ inputs.capture_seconds }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
