name: DIAG Follow — bot ikuti Bartes via event 'C'

# Bot mengikuti Bartes live: baca posisi Bartes dari relay 'C'
# (Deflate, record 18 byte — TERBUKTI berisi koordinat Bartes),
# kirim posisi 'C' bot ke sampingnya + 'tbulv' berkala agar tetap terlihat.
# Menggantikan diag tangkap-frame 2026-11-09.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pkxdshop"
        required: true
      password:
        description: "Password bot pkxdshop"
        required: true
      device_id:
        description: "Device ID bot (kosong = default probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (SkyDev)"
        required: false
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      bot_user_id:
        description: "UUID bot pkxdshop"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      duration:
        description: "Detik follow (Bartes jalan pelan)"
        required: false
        default: "30"
      start_x:
        description: "X awal Bartes"
        required: false
        default: "-79.99"
      start_y:
        description: "Y awal Bartes"
        required: false
        default: "21.96"
      start_z:
        description: "Z awal Bartes"
        required: false
        default: "-76.42"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install -q aiohttp curl-cffi
      - name: Run follow
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FOLLOW_EMAIL: ${{ inputs.email }}
          FOLLOW_PASSWORD: ${{ inputs.password }}
          FOLLOW_DEVICE_ID: ${{ inputs.device_id }}
          FOLLOW_DEST_USER_ID: ${{ inputs.dest_user_id }}
          FOLLOW_BOT_USER_ID: ${{ inputs.bot_user_id }}
        run: |
          python -u follow_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --bot-user-id "${{ inputs.bot_user_id }}" --duration "${{ inputs.duration }}" --start-x "${{ inputs.start_x }}" --start-y "${{ inputs.start_y }}" --start-z "${{ inputs.start_z }}"
