name: DIAG Join Full — rekam semua frame saat bot join

# Bot join server target lalu MEREKAM SEMUA frame yang server kirim
# (login window, join window, pasca spawn). TIDAK gendong / tidak invite.
# Tujuan: ketahui apakah JoinedRoom benar dikirim (dan formatnya), apakah
# ada RoomUserUpdate / daftar pemain, dan frame apa saja yang server
# kirim sesudah JoinRoom di activity — untuk merancang "join sangat
# lengkap" agar bot ke-render seperti pemain normal.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      dest_user_id:
        description: "UUID target (pemain yang di-join bot)"
        required: false
        default: "c6c271e0-a3d9-4a93-bf64-1c715d1b7fbb"
      bot_user_id:
        description: "UUID bot"
        required: false
        default: "71056756-53c7-478e-9356-82c87fb2dd63"
      listen:
        description: "Dengarkan berapa detik pasca-spawn"
        required: false
        default: "10"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u join_full_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --dest-user-id "${{ inputs.dest_user_id }}" --bot-user-id "${{ inputs.bot_user_id }}" --listen "${{ inputs.listen }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
          PET_RESULT_SECRET: ${{ secrets.PET_RESULT_SECRET }}
