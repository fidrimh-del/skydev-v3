name: DIAG Gift Pet (1 bot)

# Diag sekali jalan (bukan produksi): 1 bot kirim 1 pet ke 1 penerima UUID
# via RoomEvent 'gifting', lalu tunggu GiftingResult (penerima harus
# konfirmasi di game; default tunggu 180 dtk).
# Dibuat 2026-11-09 atas permintaan Bartes (tes gift akun tes -> SkyDev).
# Jangan dipakai untuk order.
# Kredensial bot via input (akun Gmail mandiri, TIDAK ada di panel DB).
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email bot pengirim"
        required: true
        default: "pkxdshop.id@gmail.com"
      password:
        description: "Password bot (ROTASI sesudah tes)"
        required: true
      device_id:
        description: "Device ID bot (kosong = bawaan probe)"
        required: false
        default: ""
      pet_id:
        description: "ID pet yang dikirim (UUID instance)"
        required: true
        default: "b0cad3aa-5e99-410f-a83a-2a3f080b44ea"
      recipient:
        description: "UUID penerima (userId)"
        required: true
        default: "aae2efe1-1abb-48c2-8799-ea192692a49c"
      wait:
        description: "Tunggu Result maks (detik, penerima konfirmasi dulu)"
        required: false
        default: "180"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install curl_cffi urllib3
      - run: python -u gift_diag.py --email "${{ inputs.email }}" --password "${{ inputs.password }}" --device-id "${{ inputs.device_id }}" --pet-id "${{ inputs.pet_id }}" --recipient "${{ inputs.recipient }}" --wait "${{ inputs.wait }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FSTR_APP_KEY: ${{ secrets.FSTR_APP_KEY }}
          FSTR_APP_SECRET: ${{ secrets.FSTR_APP_SECRET }}
